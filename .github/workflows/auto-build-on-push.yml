name: Auto Build on Push

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'build.gradle.kts'
      - 'gradle.properties'

env:
  BUILD_TYPE: release

jobs:
  cleanup-workflows:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    
    steps:
    - name: Cancel running workflows
      uses: actions/github-script@v7
      with:
        script: |
          console.log('Cancelling running workflows before build...');
          
          try {
            // Get all workflows
            const workflows = await github.rest.actions.listWorkflowsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            let totalCancelled = 0;
            
            for (const workflow of workflows.data.workflows) {
              // Skip the current workflow
              if (workflow.id === context.payload.workflow.id) {
                continue;
              }
              
              // Get running workflow runs
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                status: 'in_progress',
                per_page: 100
              });
              
              for (const run of runs.data.workflow_runs) {
                console.log(`Cancelling ${workflow.name} run ${run.id}`);
                
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                  totalCancelled++;
                } catch (error) {
                  console.log(`Failed to cancel run ${run.id}: ${error.message}`);
                }
              }
            }
            
            console.log(`Cancelled ${totalCancelled} running workflows`);
            
          } catch (error) {
            console.error('Error during cleanup:', error);
            // Don't fail the build if cleanup fails
          }

  auto-build:
    runs-on: ubuntu-latest
    needs: cleanup-workflows
    permissions:
      contents: write
      packages: write
      id-token: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Generate keystore.properties
      run: |
        # 创建keystore.properties文件以避免构建错误
        cat > keystore.properties << EOF
        keyAlias=stferyaFrpcandroid
        keyPassword=1145141919810
        storeFile=keystore.jks
        storePassword=1145141919810
        EOF
        echo "Created keystore.properties file"
        
    - name: Setup debug keystore
      run: |
        # 创建调试keystore用于构建
        keytool -genkey -v -keystore app/keystore.jks -alias stferyaFrpcandroid -keyalg RSA -keysize 2048 -validity 10000 -storepass 1145141919810 -keypass 1145141919810 -dname "CN=StfreyaFrpc,O=Stfreya,C=US"
        echo "Created debug keystore"
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Grant execute permission for scripts
      run: chmod +x scripts/*.sh
      
    - name: Check if FRP kernels need update
      id: check-kernels
      run: |
        # 检查是否有FRP内核文件
        if [ ! -f "app/src/main/jniLibs/arm64-v8a/libfrpc.so" ] || [ ! -f "app/src/main/jniLibs/arm64-v8a/libfrps.so" ]; then
          echo "kernels_missing=true" >> $GITHUB_OUTPUT
          echo "FRP kernels are missing, will build them"
        else
          echo "kernels_missing=false" >> $GITHUB_OUTPUT
          echo "FRP kernels exist, skipping kernel build"
        fi
        
    - name: Build FRP kernels if needed
      if: steps.check-kernels.outputs.kernels_missing == 'true'
      run: |
        echo "Building FRP kernels..."
        ./scripts/build-frp-kernels.sh
        
    - name: Get current FRP version
      id: frp-version
      run: |
        if [ -f ".frp-version" ]; then
          FRP_VERSION=$(cat .frp-version)
        else
          FRP_VERSION=$(grep 'FrpVersion' app/build.gradle.kts | sed 's/.*"\([^"]*\)".*/\1/')
        fi
        echo "frp_version=$FRP_VERSION" >> $GITHUB_OUTPUT
        echo "Current FRP version: $FRP_VERSION"
        
    - name: Build APK
      run: |
        echo "Building $BUILD_TYPE APK..."
        ./gradlew assemble$BUILD_TYPE
        echo "Build completed successfully"
        
    - name: List APK files
      run: |
        echo "📦 Built APK files:"
        find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
        
    - name: Get APK info
      id: apk-info
      run: |
        APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
        if [ -n "$APK_FILE" ]; then
          APK_SIZE=$(stat -c%s "$APK_FILE")
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE / 1024 / 1024" | bc)
          echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "apk_size_mb=$APK_SIZE_MB" >> $GITHUB_OUTPUT
          echo "APK: $APK_FILE (${APK_SIZE_MB} MB)"
        else
          echo "No APK file found"
          exit 1
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: stfreya-frpc-${{ env.BUILD_TYPE }}-v${{ steps.frp-version.outputs.frp_version }}-${{ github.sha }}
        path: app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
        retention-days: 7
        
    - name: Create build summary
      run: |
        echo "## 📋 自动构建摘要" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 构建信息" >> $GITHUB_STEP_SUMMARY
        echo "- **触发分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **提交哈希**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **构建类型**: ${{ env.BUILD_TYPE }}" >> $GITHUB_STEP_SUMMARY
        echo "- **FRP版本**: ${{ steps.frp-version.outputs.frp_version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **内核状态**: ${{ steps.check-kernels.outputs.kernels_missing }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 📦 构建结果" >> $GITHUB_STEP_SUMMARY
        echo "- **APK文件**: ${{ steps.apk-info.outputs.apk_file }}" >> $GITHUB_STEP_SUMMARY
        echo "- **文件大小**: ${{ steps.apk-info.outputs.apk_size_mb }} MB" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 📱 支持的架构" >> $GITHUB_STEP_SUMMARY
        echo "- arm64-v8a (64位ARM)" >> $GITHUB_STEP_SUMMARY
        echo "- armeabi-v7a (32位ARM)" >> $GITHUB_STEP_SUMMARY
        echo "- x86_64 (64位x86)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 🔗 相关链接" >> $GITHUB_STEP_SUMMARY
        echo "- [构建日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        echo "- [下载APK](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('🤖 自动构建完成')
          );
          
          const commentBody = `## 🤖 自动构建完成
          
          ### 📦 构建信息
          - **FRP版本**: ${{ steps.frp-version.outputs.frp_version }}
          - **构建类型**: ${{ env.BUILD_TYPE }}
          - **APK大小**: ${{ steps.apk-info.outputs.apk_size_mb }} MB
          - **内核状态**: ${{ steps.check-kernels.outputs.kernels_missing == 'true' && '已更新' || '使用现有' }}
          
          ### 📱 下载APK
          请到 [Actions页面](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) 下载构建的APK文件。
          
          ---
          *此评论由自动构建工作流生成*`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: commentBody
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
          }

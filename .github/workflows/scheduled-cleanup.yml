name: Scheduled Cleanup

on:
  schedule:
    # 每天凌晨2点清理失败的工作流
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      days_old:
        description: 'Cleanup workflows older than X days'
        required: true
        default: 7
        type: number
      dry_run:
        description: 'Dry run (only show what would be deleted)'
        required: true
        default: false
        type: boolean

env:
  DAYS_OLD: ${{ github.event.inputs.days_old || 7 }}
  DRY_RUN: ${{ github.event.inputs.dry_run || false }}

jobs:
  cleanup-failed-workflows:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    
    steps:
    - name: Cleanup failed workflows
      uses: actions/github-script@v7
      with:
        script: |
          const daysOld = parseInt('${{ env.DAYS_OLD }}');
          const dryRun = '${{ env.DRY_RUN }}' === 'true';
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - daysOld);
          
          console.log(`Cleaning up failed workflows older than ${daysOld} days (before ${cutoffDate.toISOString()})`);
          if (dryRun) {
            console.log('DRY RUN MODE - No workflows will be deleted');
          }
          
          try {
            // Get all workflows
            const workflows = await github.rest.actions.listWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
          
            let totalDeleted = 0;
            let totalSkipped = 0;
            let totalCancelled = 0;
            
            for (const workflow of workflows.data.workflows) {
              console.log(`\nProcessing workflow: ${workflow.name} (ID: ${workflow.id})`);
              
              // Cancel running workflows first
              const runningRuns = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                status: 'in_progress',
                per_page: 100
              });
              
              for (const run of runningRuns.data.workflow_runs) {
                console.log(`  - Cancelling running workflow ${run.id} (${run.created_at})`);
                
                if (!dryRun) {
                  try {
                    await github.rest.actions.cancelWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id
                    });
                    console.log(`    ✓ Cancelled run ${run.id}`);
                    totalCancelled++;
                  } catch (error) {
                    console.log(`    ✗ Failed to cancel run ${run.id}: ${error.message}`);
                  }
                } else {
                  console.log(`    [DRY RUN] Would cancel run ${run.id}`);
                  totalCancelled++;
                }
              }
              
              // Delete failed workflows
              const failedRuns = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                status: 'completed',
                conclusion: 'failure',
                per_page: 100
              });
              
              for (const run of failedRuns.data.workflow_runs) {
                const runDate = new Date(run.created_at);
                
                // Skip if run is newer than cutoff date
                if (runDate > cutoffDate) {
                  totalSkipped++;
                  continue;
                }
                
                console.log(`  - Run ${run.id} (${run.created_at}): ${run.conclusion} - ${run.status}`);
                
                if (!dryRun) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id
                    });
                    console.log(`    ✓ Deleted run ${run.id}`);
                    totalDeleted++;
                  } catch (error) {
                    console.log(`    ✗ Failed to delete run ${run.id}: ${error.message}`);
                  }
                } else {
                  console.log(`    [DRY RUN] Would delete run ${run.id}`);
                  totalDeleted++;
                }
              }
            }
            
            console.log(`\n=== Cleanup Summary ===`);
            console.log(`Running workflows cancelled: ${totalCancelled}`);
            console.log(`Failed workflows processed: ${totalDeleted + totalSkipped}`);
            console.log(`Workflows deleted/skipped: ${totalDeleted}/${totalSkipped}`);
            
            if (dryRun) {
              console.log('\nThis was a dry run. Set dry_run to false to actually delete workflows.');
            }
            
            // Set output for other jobs
            core.setOutput('cancelled', totalCancelled);
            core.setOutput('deleted', totalDeleted);
            core.setOutput('skipped', totalSkipped);
            
          } catch (error) {
            console.error('Error during cleanup:', error);
            core.setFailed(error.message);
          }

  cleanup-successful-workflows:
    runs-on: ubuntu-latest
    needs: cleanup-failed-workflows
    permissions:
      actions: write
      contents: read
    if: ${{ !env.DRY_RUN }}
    
    steps:
    - name: Cleanup old successful workflows
      uses: actions/github-script@v7
      with:
        script: |
          const daysOld = parseInt('${{ env.DAYS_OLD }}');
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - daysOld);
          
          console.log(`Cleaning up successful workflows older than ${daysOld} days (before ${cutoffDate.toISOString()})`);
          
          try {
            // Get all workflows
            const workflows = await github.rest.actions.listWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            let totalDeleted = 0;
            let totalSkipped = 0;
            
            for (const workflow of workflows.data.workflows) {
              console.log(`\nProcessing workflow: ${workflow.name} (ID: ${workflow.id})`);
              
              // Delete successful workflows (keep only recent ones)
              const successfulRuns = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                status: 'completed',
                conclusion: 'success',
                per_page: 100
              });
              
              // Keep the 5 most recent successful runs, delete the rest
              const runsToDelete = successfulRuns.data.workflow_runs.slice(5);
              
              for (const run of runsToDelete) {
                const runDate = new Date(run.created_at);
                
                // Skip if run is newer than cutoff date
                if (runDate > cutoffDate) {
                  totalSkipped++;
                  continue;
                }
                
                console.log(`  - Run ${run.id} (${run.created_at}): ${run.conclusion} - ${run.status}`);
                
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                  console.log(`    ✓ Deleted run ${run.id}`);
                  totalDeleted++;
                } catch (error) {
                  console.log(`    ✗ Failed to delete run ${run.id}: ${error.message}`);
                }
              }
            }
            
            console.log(`\n=== Successful Workflows Cleanup Summary ===`);
            console.log(`Successful workflows processed: ${totalDeleted + totalSkipped}`);
            console.log(`Workflows deleted/skipped: ${totalDeleted}/${totalSkipped}`);
            
          } catch (error) {
            console.error('Error during successful workflows cleanup:', error);
            core.setFailed(error.message);
          }
